# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python tests

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.torch-type == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        torch-version: ["2.5.0", "2.13.0"]
        torch-type: ["stable"]
        include:
        - python-version: "3.12"
          torch-version: "nightly"
          torch-type: "nightly"

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ "${{ matrix.torch-type }}" = "nightly" ]; then
          pip install --pre torch --index-url https://download.pytorch.org/whl/nightly/cpu
        else
          pip install torch==${{ matrix.torch-version }}
        fi
        pip install -r requirements-ci.txt
    - name: Run pytest
      run: |
        python -m pytest --ignore=torchsparsegradutils/tests/test_doctests.py
    - name: Type check with Pyrefly
      if: >-
        (matrix.python-version == '3.10' && matrix.torch-version == '2.5.0') ||
        (matrix.python-version == '3.12' && matrix.torch-version == '2.13.0')
      run: |
        pyrefly check
        pyrefly check -c pyproject.toml typing_tests/sparse_layout_positive.py
        pyrefly check -c pyproject.toml --expectations typing_tests/sparse_layout_negative.py
    - name: Test installing package
      run: |
        python -m pip install .
    - name: Type check installed package
      if: >-
        (matrix.python-version == '3.10' && matrix.torch-version == '2.5.0') ||
        (matrix.python-version == '3.12' && matrix.torch-version == '2.13.0')
      run: |
        mkdir -p "${RUNNER_TEMP}/typing-contracts"
        cp typing_tests/*.py "${RUNNER_TEMP}/typing-contracts/"
        cd "${RUNNER_TEMP}/typing-contracts"
        pyrefly check --preset default --python-interpreter-path "$(command -v python)" sparse_layout_positive.py
        pyrefly check --preset default --python-interpreter-path "$(command -v python)" --expectations sparse_layout_negative.py
    - name: Check experimental sparse shapes
      if: matrix.python-version == '3.12' && matrix.torch-version == '2.13.0'
      run: |
        shape_deps="${GITHUB_WORKSPACE}/.cache/pyrefly-shapes"
        python -m pip install --no-deps --target "$shape_deps" -r requirements-shapes.txt
        python -m pyrefly check -c pyrefly-shapes.toml
        python -m pyrefly check -c pyrefly-shapes.toml --expectations typing_tests/shapes/negative.py
        PYTHONPATH=. python typing_tests/shapes/runtime.py
        shape_contracts="$(mktemp -d)"
        cp typing_tests/shapes/*.py "$shape_contracts/"
        cd "$shape_contracts"
        shape_stubs="$(python -c 'from pathlib import Path; import torchsparsegradutils; print(Path(torchsparsegradutils.__file__).parent / "_shape_stubs")')"
        python -m pyrefly check --preset default --python-version 3.13 --search-path "$shape_stubs" --search-path "$shape_deps" --python-interpreter-path "$(command -v python)" positive.py
        python -m pyrefly check --preset default --python-version 3.13 --search-path "$shape_stubs" --search-path "$shape_deps" --python-interpreter-path "$(command -v python)" --expectations negative.py
        python runtime.py
