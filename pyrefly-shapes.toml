# Optional experimental sparse layout and shape check.
required-version = "==1.3.1"
preset = "default"
# Static target for upstream shape stub syntax.
python-version = "3.13"
project-includes = [
    "typing_tests/shapes/positive.py",
    "torchsparsegradutils/_shape_stubs/**/*.pyi",
]
project-excludes = [".cache/**"]
search-path = [
    "torchsparsegradutils/_shape_stubs",
    ".cache/pyrefly-shapes",
    ".",
]
use-ignore-files = false
